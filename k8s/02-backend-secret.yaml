# TEMPLATE ONLY — replace every placeholder value below before applying,
# and do NOT commit the real, filled-in version of this file to git (add
# it to .gitignore once you've customized it, or better: skip this file
# entirely and create the Secret imperatively instead, which never
# round-trips through a file on disk at all:
#
#   kubectl create secret generic backend-secret \
#     --namespace orthoassist \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL="postgresql://postgres:<real-password>@postgres:5432/orthoassist"
#
# `stringData` (not `data`) is used below so you can edit this in plain
# text — Kubernetes base64-encodes it for you on apply; you never need to
# do that by hand.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: orthoassist
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_OUTPUT_OF_openssl_rand_hex_32"
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/orthoassist"
  # Only needed if you're using the in-cluster Postgres in 03-postgres.yaml
  # (it reads this same value for POSTGRES_PASSWORD) — omit this key
  # entirely if DATABASE_URL above points at an external managed database.
  POSTGRES_PASSWORD: "postgres"
