# Self-contained in-cluster Postgres — convenient for a self-hosted demo
# deployment where you don't want to pay for/set up a managed database.
#
# For real production use, prefer a managed Postgres (Render Postgres,
# Supabase, AWS RDS, etc.) instead and just point DATABASE_URL in
# 02-backend-secret.yaml at it — delete this file entirely in that case.
# A StatefulSet you manage yourself means YOU are responsible for backups,
# failover, and version upgrades; a managed database handles that for you.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: orthoassist
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: orthoassist
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Headless Service (clusterIP: None) — gives the StatefulSet pod a stable
# DNS name ("postgres.orthoassist.svc.cluster.local", or just "postgres"
# from within the same namespace) that DATABASE_URL relies on.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: orthoassist
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
